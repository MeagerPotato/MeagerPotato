<svg xmlns="http://www.w3.org/2000/svg" width="880" height="280" viewBox="0 0 880 280" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<style>.arc{animation:draw 1.4s cubic-bezier(.2,.7,.2,1) .2s both}@keyframes draw{from{stroke-dasharray:0 527.8}}.tile{animation:up .5s ease-out both}@keyframes up{from{opacity:0;transform:translateY(10px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important;opacity:1!important;}}</style>

<defs>
  <linearGradient id="plume" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0" stop-color="#ff8a3d"/><stop offset="1" stop-color="#ffd27a"/>
  </linearGradient>
</defs>
<rect x="0.5" y="0.5" width="879" height="279" rx="14" fill="#0a0e17" stroke="#1c2436"/>
<text x="40" y="44" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" letter-spacing="2" fill="#ff8a3d" text-anchor="start">STREAK</text>
<circle cx="160" cy="148" r="84" fill="none" stroke="#0f1522" stroke-width="14"/>
<circle cx="160" cy="148" r="84" fill="none" stroke="#1c2436" stroke-width="1" stroke-dasharray="2 5" opacity="0.9"/>
<circle class="arc" opacity="0" cx="160" cy="148" r="84" fill="none" stroke="url(#plume)" stroke-width="14"
  stroke-linecap="round" stroke-dasharray="0.0 527.8" transform="rotate(-90 160 148)"
  style="--len:0.0"/>
<text x="160" y="162" font-size="58" font-weight="700" fill="#e8ecf4" text-anchor="middle">0</text>
<text x="160" y="186" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#8a93a8" text-anchor="middle">day streak</text>
<text x="160" y="258" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#4d566b" text-anchor="middle">last active Oct 28</text>

<g class="tile" style="animation-delay:0.15s">
  <rect x="330" y="28" width="251" height="106" rx="10" fill="#0f1522" stroke="#1c2436"/>
  <text x="348" y="56" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" letter-spacing="2" fill="#8a93a8" text-anchor="start">LONGEST STREAK</text>
  <text x="347" y="96" font-size="34" font-weight="700" fill="#e8ecf4">14</text>
  <text x="395" y="96" font-size="15" fill="#8a93a8">days</text>
  <text x="348" y="118" font-size="12.5" fill="#4d566b">Aug 29 to Sep 11</text>
</g>
<g class="tile" style="animation-delay:0.27s">
  <rect x="595" y="28" width="251" height="106" rx="10" fill="#0f1522" stroke="#1c2436"/>
  <text x="613" y="56" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" letter-spacing="2" fill="#8a93a8" text-anchor="start">WEEKLY STREAK</text>
  <text x="612" y="96" font-size="34" font-weight="700" fill="#e8ecf4">13</text>
  <text x="660" y="96" font-size="15" fill="#8a93a8">weeks</text>
  <text x="613" y="118" font-size="12.5" fill="#4d566b">weeks in a row with activity</text>
</g>
<g class="tile" style="animation-delay:0.39s">
  <rect x="330" y="148" width="251" height="106" rx="10" fill="#0f1522" stroke="#1c2436"/>
  <text x="348" y="176" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" letter-spacing="2" fill="#8a93a8" text-anchor="start">CONTRIBUTIONS</text>
  <text x="347" y="216" font-size="34" font-weight="700" fill="#e8ecf4">1,099</text>
  <text x="446" y="216" font-size="15" fill="#8a93a8"></text>
  <text x="348" y="238" font-size="12.5" fill="#4d566b">58 active days, last 12 months</text>
</g>
<g class="tile" style="animation-delay:0.51s">
  <rect x="595" y="148" width="251" height="106" rx="10" fill="#0f1522" stroke="#1c2436"/>
  <text x="613" y="176" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" letter-spacing="2" fill="#8a93a8" text-anchor="start">BEST DAY</text>
  <text x="612" y="216" font-size="34" font-weight="700" fill="#e8ecf4">124</text>
  <text x="680" y="216" font-size="15" fill="#8a93a8"></text>
  <text x="613" y="238" font-size="12.5" fill="#4d566b">Sep 19, 2026</text>
</g>
</svg>
