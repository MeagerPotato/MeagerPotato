name: Update profile

# Rebuilds the profile cards and README from fresh data every 6 hours.
# Also runs when the scripts or template change, and from the Actions tab.

"on":
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "profile/README.template.md"
      - ".github/workflows/update-profile-art.yml"

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      # If a source is down, keep going with the last saved data so the
      # profile still renders, then fail at the end so GitHub emails you.
      - name: Fetch contributions
        id: contributions
        continue-on-error: true
        run: python scripts/fetch_contributions.py

      - name: Fetch recent activity
        id: activity
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_activity.py

      - name: Render cards and README
        run: python scripts/render.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data profile README.md
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "chore: refresh profile [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Report a failed fetch
        if: steps.contributions.outcome == 'failure' || steps.activity.outcome == 'failure'
        run: |
          echo "::error::A data fetch failed (contributions: ${{ steps.contributions.outcome }}, activity: ${{ steps.activity.outcome }}). The profile was rendered from the last saved data."
          exit 1
